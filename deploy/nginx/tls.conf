server {
    listen 443 ssl;
    server_name moscowrealtime-api.sytes.net;

    ssl_certificate /etc/letsencrypt/live/moscowrealtime-api.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moscowrealtime-api.sytes.net/privkey.pem;

    location / {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
