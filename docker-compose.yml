services:
  moscow-realtime-server:
    build: .
    container_name: moscow-realtime-server
    ports:
      - "4000:80"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
